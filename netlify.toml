# Netlify build configuration.
# Production deploys build from the `main` branch (set as the production
# branch when the site is connected in the Netlify UI).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires Node >= 22.12
  NODE_VERSION = "22"
  
  # These are public by design: a Vite client app bakes them into the JS
  # bundle, and the anon key is safe to expose because Postgres RLS is the
  # security boundary (see docs/adr/0001-rls-sole-security-boundary.md).
  # Without this, Netlify's secrets scanner fails the build on finding their
  # values in dist/.
  # VITE_APP_BASE_URL (optional) overrides the public app base URL used for
  # share links; defaults to the page origin at runtime when unset.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_APP_BASE_URL"

# Single-page app: vue-router uses history mode, so every route must serve
# index.html and let the client router resolve it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (tracked in the public repo's issue #5).
# CSP allowlist derived from actual app usage:
#   connect: Supabase (REST/auth/storage/functions), Nominatim reverse geocoding
#   img: self + Supabase storage, OSM tiles, USGS satellite tiles, Google photo
#        hosts (mirror-photo falls back to the source URL when mirroring fails),
#        data:/blob: for bundled Leaflet assets and local photo previews
#   No external scripts, styles, fonts, frames, workers, or realtime sockets.
#   'unsafe-inline' styles: Vue/Leaflet set inline style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://nouzhcobeeakhmokhidc.supabase.co https://*.tile.openstreetmap.org https://basemap.nationalmap.gov https://lh3.googleusercontent.com https://mymaps.usercontent.google.com; connect-src 'self' https://nouzhcobeeakhmokhidc.supabase.co https://nominatim.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000"
