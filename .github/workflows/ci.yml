# CI: the same gate as a local `npm run build` (ESLint boundary rules + size guards + vite) plus the
# unit tests. The headless route smoke needs a browser + Supabase env, so it stays a local/deploy check.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
